name: Execucao Diario LegalTech Bot

on:
  schedule:
    # 04:00 BRT = 07:00 UTC
    - cron: '0 07 * * *'
  workflow_dispatch:

jobs:
  rodar_automacao:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar o codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Fontes do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Instalar Bibliotecas Diretamente (Sem Erro)
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv google-genai requests beautifulsoup4 pillow

      - name: Executar Robo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
          touch historico_urls.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico_urls.txt
          git commit -m "🤖 Auto: Atualizando historico" || exit 0
          git push origin main
